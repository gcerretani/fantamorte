name: Tests

on:
  push:
    branches: [master, develop, audit-hardening-integrity-2026-09]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: chiave-finta-solo-per-i-test

    steps:
      # Pins are the commits behind the major tags, resolved 2026-09-06.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install MySQL client headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config default-libmysqlclient-dev

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test game wikidata_api --parallel auto
